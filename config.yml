system:
  device: "cuda"
  num_workers: 4
  pin_memory: true

data:
  csv_path: "dataset.csv"
  images_dir: "images"
  img_size: 224
  max_images_per_group: 15
  val_fold: 0
  n_splits: 10
  cached_features_dir: "cached_features"

model:
  # mobileclip2_s0 | mobileclip2_s3 | mobileclip2_b | mobileclip2_l14
  name: "mobileclip2_l14"
  head_hidden_dim: 256
  head_dropout: 0.1
  unfreeze_last: 200

train:
  batch_size: 2
  lr_head: 0.0002
  lr_backbone: 0.000001
  epochs: 50
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  save_dir: "checkpoints"
  patience: 20
  # Soft-target KLD + lower backbone LR for stability
  temperature: 0.3
  target_temperature: 0.5
  margin_weight: 0.3   # weight for KLD ranking loss
  ce_weight: 1.0       # weight for best-image CE loss
  warmup_epochs: 5
  gradient_accumulation_steps: 4
  use_cached_features: false
