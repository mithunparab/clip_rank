system:
  device: "cuda"
  num_workers: 4
  pin_memory: true

data:
  csv_path: "dataset.csv"
  images_dir: "images"
  img_size: 224
  max_images_per_group: 15
  val_fold: 0
  n_splits: 10
  cached_features_dir: "cached_features"

model:
  # mobileclip2_s0 | mobileclip2_s3 | mobileclip2_b | mobileclip2_l14
  name: "mobileclip2_l14"
  head_hidden_dim: 256
  head_dropout: 0.1
  unfreeze_last: 20

train:
  batch_size: 2
  lr_head: 0.001
  lr_backbone: 0.0000005
  epochs: 60
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  save_dir: "checkpoints"
  patience: 10
  warmup_epochs: 2
  gradient_accumulation_steps: 8
  eta_min: 0.0000005     # LR floor — don't let learning die
  use_cached_features: false
