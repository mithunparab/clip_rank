system:
  device: "cuda"
  num_workers: 4
  pin_memory: true

data:
  csv_path: "dataset.csv"
  images_dir: "images"
  img_size: 224
  max_images_per_group: 15
  val_fold: 0
  n_splits: 10
  cached_features_dir: "cached_features"

model:
  # mobileclip2_s0 | mobileclip2_s3 | mobileclip2_b | mobileclip2_l14
  name: "mobileclip2_l14"
  head_hidden_dim: 256
  head_dropout: 0.1
  unfreeze_last: 200

train:
  batch_size: 2
  lr_head: 0.0002
  lr_backbone: 0.000001
  epochs: 50
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  save_dir: "checkpoints"
  patience: 20
  # GoldSet + Plackett-Luce losses
  temperature: 1.0       # PL prediction temperature (1.0 = standard)
  margin_weight: 0.3     # weight for PL ranking loss
  warmup_epochs: 5
  gradient_accumulation_steps: 4
  use_cached_features: false

vlm:
  base_model: "unsloth/Qwen3.5-0.8B"
  load_in_4bit: false
  lora:
    r: 16
    lora_alpha: 16
    lora_dropout: 0
  sft:
    batch_size: 2
    gradient_accumulation_steps: 4
    lr: 0.0002
    max_steps: 500
    warmup_steps: 50
    eval_steps: 50
    save_steps: 100
    weight_decay: 0.01
    save_dir: "checkpoints_vlm_sft"
  dpo:
    batch_size: 1
    gradient_accumulation_steps: 8
    lr: 0.00005
    beta: 0.1
    max_steps: 200
    warmup_steps: 20
    save_steps: 50
    weight_decay: 0.01
    save_dir: "checkpoints_vlm_dpo"
