system:
  device: "cuda"
  num_workers: 4
  pin_memory: true

data:
  csv_path: "dataset.csv"
  images_dir: "images"
  img_size: 224
  max_images_per_group: 15
  val_fold: 0
  n_splits: 10
  cached_features_dir: "cached_features"

model:
  # mobileclip2_s0 | mobileclip2_s3 | mobileclip2_b | mobileclip2_l14 | dinov3_convnext_small
  name: "dinov3_convnext_small"
  head_hidden_dim: 256
  head_dropout: 0.1
  unfreeze_last: 60

train:
  batch_size: 2
  lr_head: 0.001
  lr_backbone: 0.000001
  epochs: 10
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  save_dir: "checkpoints"
  patience: 15
  # Soft-target KLD + lower backbone LR for stability
  temperature: 0.3
  target_temperature: 2.0
  margin_weight: 0.5
  warmup_epochs: 1
  gradient_accumulation_steps: 4
  use_cached_features: false
