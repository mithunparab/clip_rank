system:
  device: "cuda"
  num_workers: 4
  pin_memory: true

data:
  csv_path: "dataset.csv"
  images_dir: "images"
  img_size: 224
  max_images_per_group: 15
  val_fold: 0
  n_splits: 10
  cached_features_dir: "cached_features"

model:
  # mobileclip2_s0 | mobileclip2_s3 | mobileclip2_b | mobileclip2_l14
  name: "mobileclip2_l14"
  head_hidden_dim: 256
  head_dropout: 0.1
  unfreeze_last: 200

train:
  batch_size: 32
  lr_head: 0.0003
  lr_backbone: 0.000002
  epochs: 50
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  save_dir: "checkpoints"
  patience: 20
  warmup_epochs: 3
  gradient_accumulation_steps: 2
  # LDL training
  ldl_sigma: 1.0         # Gaussian width for non-gold scores
  ldl_gold_sigma: 0.5    # tighter Gaussian for gold tier (score >= 7)
