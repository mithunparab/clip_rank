system:
  device: "cuda"
  num_workers: 4
  pin_memory: true

data:
  csv_path: "dataset.csv"
  images_dir: "images"
  img_size: 224
  max_images_per_group: 15
  val_fold: 0
  n_splits: 10
  cached_features_dir: "cached_features"

model:
  # mobileclip2_l14 | clip_vit_l14 | metaclip2_l14 | vit_b16 | etc.
  name: "mobileclip2_l14"
  head_hidden_dim: 256
  head_dropout: 0.1
  unfreeze_last: 200

train:
  batch_size: 2
  lr_head: 0.0003
  lr_backbone: 0.0000005
  epochs: 50
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  save_dir: "checkpoints"
  patience: 20
  warmup_epochs: 0
  gradient_accumulation_steps: 32
  # Ordinal (CORAL) training
  gold_weight: 3.0       # extra weight on gold-tier thresholds (7, 8, 9)
